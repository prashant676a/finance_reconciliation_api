name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_recon_test
          POSTGRES_USER: recon
          POSTGRES_PASSWORD: recon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recon -d finance_recon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://recon:recon_ci@127.0.0.1:5432/finance_recon_test

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Typecheck source and tests
        run: npm run typecheck && npm run typecheck:tests

      - name: Run unit and integration tests
        run: npm test
